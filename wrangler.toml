# Cloudflare Pages project configuration (the source of truth for these settings once deployed; the dashboard shows
# them read-only). The site is the Vite build in dist/; functions/ adds POST /api/play, which writes the anonymous play
# counts (src/telemetry.ts) to the Workers Analytics Engine dataset below (read with scripts/stats.mjs).
name = "late-roadster"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-18"

[[analytics_engine_datasets]]
binding = "PLAYS"
dataset = "late_roadster_plays"
